name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / mcp ${{ matrix.mcp }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        mcp: ["latest"]
        include:
          # The 1.x SDK line exposes FastMCP; 2.x renamed it to MCPServer.
          - os: ubuntu-latest
            python: "3.11"
            mcp: "1.x"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.mcp }}" = "1.x" ]; then python -m pip install "mcp>=1.30,<2"; fi
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Examples
        shell: bash
        run: |
          python examples/multi_agent_collaboration.py
          python examples/rollback_on_hallucination.py
          python examples/portable_notices.py
          python examples/signed_folder_sync.py

  dependencies:
    name: Dependency advisory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pip-audit
      - name: Freeze exact third-party versions (the local candidate has no advisory entry)
        run: python -m pip freeze --exclude memkernel-mcp > requirements-audit.txt
      - run: python -m pip_audit -r requirements-audit.txt --no-deps --disable-pip --strict --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: |
            requirements-audit.txt
            dependency-audit.json

  package:
    name: Wheel install + memkernel doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install into a clean environment and verify
        shell: bash
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          mkdir -p /tmp/project/.git && cd /tmp/project
          /tmp/clean/bin/memkernel attach claude-code cursor --dry-run
          /tmp/clean/bin/memkernel doctor
