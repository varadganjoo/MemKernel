name: Publish to PyPI

# Publishing a GitHub Release uploads that version to PyPI via Trusted Publishing
# (OIDC): no API token is stored anywhere. One-time setup on pypi.org:
# Account settings -> Publishing -> add a pending publisher with
#   project "memkernel-mcp", owner "varadganjoo", repository "MemKernel",
#   workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Check the tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          fi
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2


